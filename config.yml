# Check `ares-sc2/src/ares/config.yml` for valid config options
# Use this to override those values
# Can add own unique config options here if desired

# Custom values not used by ares
MyBotName: PiG_Bot
BotDebug: False  # Enable debug output for bot-specific systems (targeting, nova, etc.)
MyBotRace: Protoss
# setting ture allows auto upload to aiareana (https://aiarena.net/) on push to `main` branch
# see tutorial on readme before setting to True
AutoUploadToAiarena: True
BotZipPubliclyDownloadable: False
BotDataPubliclyDownloadable: False
BotDataEnabled: True
########################
# Wall Generation Mode - when True, runs WallGeneratorBot instead of Main Bot
WallGenerationMode: False
########################

# Local game settings (run.py) — ignored for ladder games / --TestBot runs
LocalGame:
    OpponentRace: Zerg  # Terran | Zerg | Protoss | Random
    Difficulty: VeryHard   # VeryEasy | Easy | Medium | MediumHard | Hard | Harder | VeryHard | CheatVision | CheatMoney | CheatInsane
    AIBuild: Rush         # RandomBuild | Rush | Timing | Power | Macro | Air
    # One map is picked at random each run
    Maps:
        - MagannathaAIE_v2
        # - TorchesAIE_v4
        # - PylonAIE_v4
        # - PersephoneAIE_v4
        # - IncorporealAIE_v4
        # - LeyLinesAIE_v3
        # - UltraloveAIE_v2

UseData: True
Debug: False #Enable debug output for ares

# Belief layer feature flags for Phase 1
Belief:
    enable_composition: True  # Phase 1: Probability-weighted enemy army tracking
    enable_strategy: True     # Phase 2: Probabilistic strategy classification
    enable_opponent: True     # Phase 4: Cross-game opponent priors (Dirichlet)
    enable_scout_voi: False   # Phase 3: Level-2 routing + staleness×relevance ranking

# Response-curve parameters for the utility-AI reasoner (bot/utilities/reasoner.py).
# Personality hypotheses: seeded from Liquipedia-annotated reasoning, refit from
# telemetry in Task 8. Steepness is the primary anti-oscillation knob — raise it
# to commit harder around the tipping point, lower it to waffle longer.
# One entry per scored quantity: minimum/maximum are that quantity's raw range.
UtilityAI:
    Curves:
        threat:                 # threat-like inputs: distant noise ignored, commitment near critical
            kind: exponential
            minimum: 0.0
            maximum: 1.0
            steepness: 4.0
        response:               # respond-vs-continue decisions: sigmoid around the tipping point
            kind: logistic
            minimum: 0.0
            maximum: 1.0
            midpoint: 0.5
            steepness: 8.0
        value:                 # additive value terms (economy, tech): plain normalized scale
            kind: linear
            minimum: 0.0
            maximum: 1.0
        counter:                # counter effectiveness: the scoring table's own scale (-10..+12)
            kind: linear
            minimum: -8.0
            maximum: 8.0
        economy:               # affordability headroom: resources/min the economy can spend minus the mix's price
            kind: logistic
            minimum: -600.0
            maximum: 600.0
            midpoint: 0.0
            steepness: 4.0
        tech:                  # share of researched upgrades the mix exploits
            kind: linear
            minimum: 0.0
            maximum: 1.0
        cost:                  # resource + production-time burden of one unit of the mix
            kind: linear
            minimum: 0.0
            maximum: 560.0
        income:                # resources per minute of a full economy (1600 = "full")
            kind: logistic
            minimum: 0.0
            maximum: 2000.0
            midpoint: 800.0
            steepness: 8.0
        commitment:            # hysteresis: how much of the margin the incumbent keeps
            kind: linear
            minimum: 0.0
            maximum: 1.0

    # Macro composition scoring (bot/managers/composition_scoring.py).
    # Weights are seeds — the counter term carries the scoring table's own
    # magnitude (Liquipedia-annotated pairs, -10..+12); the economy and cost
    # terms are guards that only separate the candidates while the economy is
    # tight. Task 8 refits them from telemetry.
    RescoreInterval: 10      # macro cycles between forced re-scores (a belief change re-scores earlier)
    Composition:
        CommitmentMargin: 0.03  # score margin a challenger must beat to take the crown
        Weights:
            counter: 2.0
            economy: 1.0
            tech: 0.5
            cost: 0.6
            commitment: 0.03

Distances:
    GroundEnemyNearBases: 25.
    GroundEnemyLeavingBases: 30.
GameStep: 4
DebugGameStep: 4

# Turn ares features on/off for performance reasons
Features:
    # this grid is useful for disruptor balls and maybe some other uses
    # off by default to save computation
    TacticalGroundGrid: True

DebugOptions:
    # one of: Air, AirVsGround, Ground, GroundAvoidance, AirAvoidance
    ActiveGrid: TacticalGround
    ChatDebug: True
    DebugSpawn: True
    ShowPathingCost: False
    ResourceDebug: False
    ShowBuildingFormation: False